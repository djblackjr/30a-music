name: Update Music Events

on:
  schedule:
    # GitHub's own `schedule` trigger has never reliably fired for this repo
    # (confirmed: the original Friday cron never ran once via `schedule` --
    # only manual/dispatch runs show up in the history). Kept only as a
    # fallback in case it fires; the real trigger is an external cron-job.org
    # ping hitting workflow_dispatch directly (same fix as the sibling 331
    # Bridge Fishing Report app, where it's been running reliably).
    # workflow_dispatch runs aren't subject to the same queue congestion as
    # `schedule` is.
    #
    # Daily: this repo is public, so GitHub Actions minutes are free
    # regardless of frequency, and the pipeline's only paid dependency
    # (OpenAI Vision, used just for the rare SoWal flyer-image-only page --
    # see app/crawlers/sowal.py's _parse_flyer_image fallback) costs
    # fractions of a cent per run either way. Daily is simplest to reason
    # about and catches a venue changing its own site (no screenshot
    # dropped anywhere) sooner than every-2-days did. Inbox screenshots
    # still don't wait on this at all -- scripts/process_inbox.py (the
    # local launchd watcher) commits and pushes on its own the moment a
    # new screenshot lands; this run is the crawler sweep + safety-net
    # publish on top of that.
    #
    # NOTE: cron-job.org's schedule is configured on cron-job.org itself and
    # is not visible/editable from this repo -- update it there too so the
    # actual trigger matches this fallback.
    - cron: '17 12 * * *'  # Daily, ~7am/8am Central, depending on DST
  workflow_dispatch:  # Allow manual trigger — this is what cron-job.org calls

  # A screenshot committed straight into the repo (images/inbox/*, bypassing
  # its own .gitignore entry -- how a session without shell access to this
  # Mac adds one, e.g. "Add The Typos schedule screenshot to images/inbox
  # for ingestion") previously had to wait for the next scheduled run to be
  # processed -- worst case up to a day, and entirely at the mercy of
  # cron-job.org's own schedule, which isn't visible from this repo. `push`
  # is a native GitHub trigger (unlike `schedule`, which this repo's own
  # history shows is unreliable -- see above), so this reacts within
  # GitHub's normal queue time (seconds to low minutes), not a schedule
  # cycle. Safe: the commit step below only ever touches data/events.db,
  # docs/index.html, and logs/changes/, never images/inbox/, so this can't
  # trigger itself into a loop.
  push:
    branches: [main]
    paths:
      - 'images/inbox/**'

permissions:
  # Default GITHUB_TOKEN is read-only unless declared otherwise; without this
  # the pipeline step succeeds but "git push" 403s, silently leaving the live
  # dashboard on the previous day's build. Confirmed via the Actions API: the
  # one schedule-triggered run that ever fired (2026-07-16) built fine and
  # failed only on the commit/push step.
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs the single pipeline: crawlers -> image inbox (GPT-4o Vision) ->
      # normalise + confidence + provenance -> SQLite -> reconcile -> Excel ->
      # dashboard. run_monitor.py regenerates docs/index.html itself, so there
      # is no copy step (the old `cp data/index.html docs/index.html` clobbered
      # the real dashboard).
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run_monitor.py

      - name: Commit updated dashboard + database
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/events.db docs/index.html logs/changes/
          git diff --staged --quiet || git commit -m "Auto-update events $(date +'%Y-%m-%d')"
          git push
